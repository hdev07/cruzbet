<!DOCTYPE html>
<html lang="es">
  <head>
    <script>
      (function () {
        var key = 'cruzbet-theme';
        var stored = localStorage.getItem(key);
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        var splash = document.getElementById('app-splash');
        if (splash) splash.dataset.shownAt = String(Date.now());
      })();
    </script>
    <style>
      :root,
      [data-theme='dark'] {
        --splash-bg: #071426;
        --splash-text: #f8fafc;
        --splash-muted: #a9b8c8;
        --splash-accent: #f5b942;
        --splash-glow: rgba(245, 185, 66, 0.16);
        --splash-ring: rgba(245, 185, 66, 0.4);
      }

      [data-theme='light'] {
        --splash-bg: #f8fafc;
        --splash-text: #071426;
        --splash-muted: #29455f;
        --splash-accent: #f5b942;
        --splash-glow: rgba(245, 185, 66, 0.12);
        --splash-ring: rgba(245, 185, 66, 0.45);
      }

      html,
      body {
        margin: 0;
        background: var(--splash-bg);
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
        background:
          radial-gradient(ellipse 90% 55% at 50% -15%, var(--splash-glow), transparent 70%),
          var(--splash-bg);
        transition: opacity 320ms ease, visibility 320ms ease;
      }

      #app-splash.app-splash--out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .app-splash__logo-wrap {
        position: relative;
        display: grid;
        place-items: center;
        width: 6.5rem;
        height: 6.5rem;
      }

      .app-splash__logo-ring {
        position: absolute;
        inset: 0;
        border-radius: 1.35rem;
        border: 2px solid var(--splash-ring);
        animation: app-splash-pulse 1.8s ease-in-out infinite;
      }

      .app-splash__logo {
        width: 5.5rem;
        height: 5.5rem;
        border-radius: 1.1rem;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.22);
        animation: app-splash-float 2.4s ease-in-out infinite;
      }

      .app-splash__brand {
        margin: 0;
        font: 800 1.75rem/1.1 system-ui, -apple-system, 'Segoe UI', sans-serif;
        letter-spacing: -0.03em;
        color: var(--splash-accent);
      }

      .app-splash__tagline {
        margin: -0.35rem 0 0;
        font: 500 0.95rem/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--splash-muted);
        text-align: center;
        max-width: 16rem;
      }

      .app-splash__loader {
        display: flex;
        gap: 0.45rem;
        margin-top: 0.5rem;
      }

      .app-splash__loader span {
        width: 0.45rem;
        height: 0.45rem;
        border-radius: 999px;
        background: var(--splash-accent);
        opacity: 0.35;
        animation: app-splash-dot 1.1s ease-in-out infinite;
      }

      .app-splash__loader span:nth-child(2) {
        animation-delay: 0.15s;
      }

      .app-splash__loader span:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes app-splash-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.55;
        }
        50% {
          transform: scale(1.06);
          opacity: 1;
        }
      }

      @keyframes app-splash-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }

      @keyframes app-splash-dot {
        0%,
        80%,
        100% {
          opacity: 0.3;
          transform: scale(0.85);
        }
        40% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-splash__logo-ring,
        .app-splash__logo,
        .app-splash__loader span {
          animation: none;
        }
      }
    </style>
